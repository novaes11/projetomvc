<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Categorias - Biblioteca MVC</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <header>
        <div class="header-container">
            <a th:href="@{/}" class="brand-title">Biblioteca MVC</a>
            <nav>
                <a th:href="@{/}">Início</a>
                <a th:href="@{/livros}">Livros</a>
                <a th:href="@{/autores}">Autores</a>
                <a th:href="@{/categorias}">Categorias</a>
                <a th:href="@{/usuarios}">Usuários</a>
                <a th:href="@{/emprestimos}">Empréstimos</a>
            </nav>
        </div>
    </header>

    <main class="main-content">
        <h1 class="page-title">Gestão de Categorias</h1>

        <div class="card">
            <h2 class="card-title">Nova Categoria</h2>
            <form th:action="@{/categorias}" method="post">
                <div class="form-grid">
                    <div class="form-group">
                        <label for="nome">Nome</label>
                        <input type="text" id="nome" name="nome" class="form-control" placeholder="Ex: Ficção Científica" required>
                    </div>
                    <div class="form-group">
                        <label for="genero">Gênero</label>
                        <input type="text" id="genero" name="genero" class="form-control" placeholder="Ex: Literatura Fantástica" required>
                    </div>
                    <div class="form-group">
                        <label for="area">Área</label>
                        <input type="text" id="area" name="area" class="form-control" placeholder="Ex: Humanas / Artes">
                    </div>
                    <div class="form-group">
                        <label for="descricao">Descrição</label>
                        <input type="text" id="descricao" name="descricao" class="form-control" placeholder="Ex: Livros de ficção e aventuras espaciais">
                    </div>
                </div>
                <button type="submit" class="btn btn-primary">Cadastrar Categoria</button>
            </form>
        </div>

        <div class="card">
            <h2 class="card-title">Categorias Cadastradas</h2>
            <div class="table-responsive">
                <table>
                    <thead>
                        <tr>
                            <th>#</th>
                            <th>Nome</th>
                            <th>Gênero</th>
                            <th>Área</th>
                            <th>Descrição</th>
                            <th>Ações</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="categoria, stat : ${categorias}">
                            <td th:text="${stat.count}">1</td>
                            <td th:text="${categoria.nome}">Nome</td>
                            <td th:text="${categoria.genero}">Gênero</td>
                            <td th:text="${categoria.area != null && !categoria.area.isBlank() ? categoria.area : '-'}">Área</td>
                            <td th:text="${categoria.descricao != null && !categoria.descricao.isBlank() ? categoria.descricao : '-'}">Descrição</td>
                            <td>
                                <a th:href="@{/categorias/excluir/{indice}(indice=${stat.index})}" class="btn btn-danger">Excluir</a>
                            </td>
                        </tr>
                        <tr th:if="${categorias == null || categorias.empty}">
                            <td colspan="6" class="empty-state">Nenhuma categoria cadastrada até o momento.</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>
</body>
</html>
