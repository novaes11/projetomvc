<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Usuários - Biblioteca MVC</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <header>
        <div class="header-container">
            <a th:href="@{/}" class="brand-title">Biblioteca MVC</a>
            <nav>
                <a th:href="@{/}">Início</a>
                <a th:href="@{/livros}">Livros</a>
                <a th:href="@{/autores}">Autores</a>
                <a th:href="@{/categorias}">Categorias</a>
                <a th:href="@{/usuarios}">Usuários</a>
                <a th:href="@{/emprestimos}">Empréstimos</a>
            </nav>
        </div>
    </header>

    <main class="main-content">
        <h1 class="page-title">Gestão de Usuários</h1>

        <div class="card">
            <h2 class="card-title">Novo Usuário</h2>
            <form th:action="@{/usuarios}" method="post">
                <div class="form-grid">
                    <div class="form-group">
                        <label for="nome">Nome Completo</label>
                        <input type="text" id="nome" name="nome" class="form-control" placeholder="Ex: Maria Silva" required>
                    </div>
                    <div class="form-group">
                        <label for="matricula">Matrícula</label>
                        <input type="text" id="matricula" name="matricula" class="form-control" placeholder="Ex: 20261001" required>
                    </div>
                    <div class="form-group">
                        <label for="email">E-mail</label>
                        <input type="email" id="email" name="email" class="form-control" placeholder="Ex: maria@email.com" required>
                    </div>
                    <div class="form-group">
                        <label for="telefone">Telefone</label>
                        <input type="text" id="telefone" name="telefone" class="form-control" placeholder="Ex: (11) 98765-4321">
                    </div>
                    <div class="form-group">
                        <label for="tipo">Tipo de Usuário</label>
                        <select id="tipo" name="tipo" class="form-control">
                            <option value="Estudante">Estudante</option>
                            <option value="Professor">Professor</option>
                            <option value="Comunidade">Comunidade</option>
                        </select>
                    </div>
                </div>
                <button type="submit" class="btn btn-primary">Cadastrar Usuário</button>
            </form>
        </div>

        <div class="card">
            <h2 class="card-title">Usuários Cadastrados</h2>
            <div class="table-responsive">
                <table>
                    <thead>
                        <tr>
                            <th>#</th>
                            <th>Nome</th>
                            <th>Matrícula</th>
                            <th>E-mail</th>
                            <th>Telefone</th>
                            <th>Tipo</th>
                            <th>Ações</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="usuario, stat : ${usuarios}">
                            <td th:text="${stat.count}">1</td>
                            <td th:text="${usuario.nome}">Nome</td>
                            <td th:text="${usuario.matricula}">Matrícula</td>
                            <td th:text="${usuario.email}">E-mail</td>
                            <td th:text="${usuario.telefone != null && !usuario.telefone.isBlank() ? usuario.telefone : '-'}">Telefone</td>
                            <td>
                                <span class="badge badge-info" th:text="${usuario.tipo}">Tipo</span>
                            </td>
                            <td>
                                <a th:href="@{/usuarios/excluir/{indice}(indice=${stat.index})}" class="btn btn-danger">Excluir</a>
                            </td>
                        </tr>
                        <tr th:if="${usuarios == null || usuarios.empty}">
                            <td colspan="7" class="empty-state">Nenhum usuário cadastrado até o momento.</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>
</body>
</html>
