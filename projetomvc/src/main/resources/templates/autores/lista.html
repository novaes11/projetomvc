<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Autores - Biblioteca MVC</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <header>
        <div class="header-container">
            <a th:href="@{/}" class="brand-title">Biblioteca MVC</a>
            <nav>
                <a th:href="@{/}">Início</a>
                <a th:href="@{/livros}">Livros</a>
                <a th:href="@{/autores}">Autores</a>
                <a th:href="@{/categorias}">Categorias</a>
                <a th:href="@{/usuarios}">Usuários</a>
                <a th:href="@{/emprestimos}">Empréstimos</a>
            </nav>
        </div>
    </header>

    <main class="main-content">
        <h1 class="page-title">Gestão de Autores</h1>

        <div class="card">
            <h2 class="card-title">Novo Autor</h2>
            <form th:action="@{/autores}" method="post">
                <div class="form-grid">
                    <div class="form-group">
                        <label for="nome">Nome do Autor</label>
                        <input type="text" id="nome" name="nome" class="form-control" placeholder="Ex: Clarice Lispector" required>
                    </div>
                    <div class="form-group">
                        <label for="nacionalidade">Nacionalidade</label>
                        <input type="text" id="nacionalidade" name="nacionalidade" class="form-control" placeholder="Ex: Brasileira" required>
                    </div>
                </div>
                <button type="submit" class="btn btn-primary">Cadastrar Autor</button>
            </form>
        </div>

        <div class="card">
            <h2 class="card-title">Autores Cadastrados</h2>
            <div class="table-responsive">
                <table>
                    <thead>
                        <tr>
                            <th>#</th>
                            <th>Nome</th>
                            <th>Nacionalidade</th>
                            <th>Ações</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="autor, stat : ${autores}">
                            <td th:text="${stat.count}">1</td>
                            <td th:text="${autor.nome}">Nome</td>
                            <td th:text="${autor.nacionalidade}">Nacionalidade</td>
                            <td>
                                <a th:href="@{/autores/excluir/{indice}(indice=${stat.index})}" class="btn btn-danger">Excluir</a>
                            </td>
                        </tr>
                        <tr th:if="${autores == null || autores.empty}">
                            <td colspan="4" class="empty-state">Nenhum autor cadastrado até o momento.</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>
</body>
</html>
