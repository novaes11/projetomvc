<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Livros - Biblioteca MVC</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <header>
        <div class="header-container">
            <a th:href="@{/}" class="brand-title">Biblioteca MVC</a>
            <nav>
                <a th:href="@{/}">Início</a>
                <a th:href="@{/livros}">Livros</a>
                <a th:href="@{/autores}">Autores</a>
                <a th:href="@{/categorias}">Categorias</a>
                <a th:href="@{/usuarios}">Usuários</a>
                <a th:href="@{/emprestimos}">Empréstimos</a>
            </nav>
        </div>
    </header>

    <main class="main-content">
        <h1 class="page-title">Gestão de Livros</h1>

        <div class="card">
            <h2 class="card-title">Novo Livro</h2>
            <form th:action="@{/livros}" method="post">
                <div class="form-grid">
                    <div class="form-group">
                        <label for="titulo">Título</label>
                        <input type="text" id="titulo" name="titulo" class="form-control" placeholder="Ex: Dom Casmurro" required>
                    </div>
                    <div class="form-group">
                        <label for="autor">Autor</label>
                        <input type="text" id="autor" name="autor" class="form-control" placeholder="Ex: Machado de Assis" required>
                    </div>
                    <div class="form-group">
                        <label for="categoria">Categoria</label>
                        <input type="text" id="categoria" name="categoria" class="form-control" placeholder="Ex: Literatura Brasileira" required>
                    </div>
                    <div class="form-group">
                        <label for="isbn">ISBN</label>
                        <input type="text" id="isbn" name="isbn" class="form-control" placeholder="Ex: 978-85-359-0277-8">
                    </div>
                </div>
                <button type="submit" class="btn btn-primary">Cadastrar Livro</button>
            </form>
        </div>

        <div class="card">
            <h2 class="card-title">Livros Cadastrados</h2>
            <div class="table-responsive">
                <table>
                    <thead>
                        <tr>
                            <th>#</th>
                            <th>Título</th>
                            <th>Autor</th>
                            <th>Categoria</th>
                            <th>ISBN</th>
                            <th>Disponibilidade</th>
                            <th>Ações</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="livro, stat : ${livros}">
                            <td th:text="${stat.count}">1</td>
                            <td th:text="${livro.titulo}">Título</td>
                            <td th:text="${livro.autor != null ? livro.autor.nome : '-'}">Autor</td>
                            <td th:text="${livro.categoria != null ? livro.categoria.nome : '-'}">Categoria</td>
                            <td th:text="${livro.isbn != null && !livro.isbn.isBlank() ? livro.isbn : '-'}">ISBN</td>
                            <td>
                                <span th:if="${livro.disponivel}" class="badge badge-success">Disponível</span>
                                <span th:unless="${livro.disponivel}" class="badge badge-warning">Emprestado</span>
                            </td>
                            <td>
                                <a th:href="@{/livros/excluir/{indice}(indice=${stat.index})}" class="btn btn-danger">Excluir</a>
                            </td>
                        </tr>
                        <tr th:if="${livros == null || livros.empty}">
                            <td colspan="7" class="empty-state">Nenhum livro cadastrado até o momento.</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>
</body>
</html>
